name: ci-cd

on:
  pull_request:
    branches: [main, developer]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint back
        run: pnpm --filter back lint

      - name: Lint front
        run: pnpm --filter front lint

  test-back:
    name: Tests (back)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conectaunb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d conectaunb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conectaunb?schema=public
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter back prisma:generate

      - run: pnpm --filter back prisma:migrate:deploy

      - name: Unit tests
        run: pnpm --filter back test

      - name: E2E tests
        run: pnpm --filter back test:e2e

  test-front:
    name: Tests (front)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm --filter front test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-back, test-front]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter back prisma:generate

      - name: Build back
        run: pnpm --filter back build

      - name: Build front
        run: pnpm --filter front build

  release-image:
    name: Release Docker image (disabled)
    runs-on: ubuntu-latest
    needs: [build]
    if: false # habilite quando o deploy for definido
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conectaunb-back:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/conectaunb-back:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-koyeb:
    name: Deploy to Koyeb (disabled)
    runs-on: ubuntu-latest
    needs: [release-image]
    if: false # habilite quando o deploy for definido
    steps:
      # Opcao A (mais simples): deploy hook unico. Defina KOYEB_DEPLOY_HOOK_URL.
      - name: Trigger Koyeb deploy hook
        if: ${{ vars.KOYEB_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsSL -X POST "${{ secrets.KOYEB_DEPLOY_HOOK_URL }}"

      # Opcao B: API /redeploy. Defina KOYEB_SERVICE e KOYEB_API_TOKEN.
      - name: Trigger Koyeb redeploy API
        if: ${{ vars.KOYEB_SERVICE != '' }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://app.koyeb.com/v1/services/${{ secrets.KOYEB_SERVICE }}/redeploy" \
            -H "Authorization: Bearer ${{ secrets.KOYEB_API_TOKEN }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Deploy failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Deploy triggered successfully"

  deploy-vercel:
    name: Deploy front to Vercel (disabled)
    runs-on: ubuntu-latest
    needs: [build]
    if: false # habilite quando o deploy for definido
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        working-directory: apps/front
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel app
        working-directory: apps/front
        run: npx vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel
        working-directory: apps/front
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
