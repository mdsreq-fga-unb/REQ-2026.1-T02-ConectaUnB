version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: conecta_unb_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: conectaunb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d conectaunb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    container_name: conecta_unb_api
    working_dir: /workspace
    command: pnpm --filter back dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/workspace
      - api_node_modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://root:rootpassword@postgres:5432/conectaunb?schema=public
      NODE_ENV: development
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  api_node_modules: