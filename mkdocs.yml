site_name: ConectaUnB
site_author: Gabriel Diniz, Giovanna Aguiar, Gustavo Abrantes, João Pedro, Mathues Lemes, Pedro Americo
site_description: Site voltado para a documentação do Grupo 5 sobre Requisitos de Software 2026.1
repo_url: https://github.com/mdsreq-fga-unb/REQ-2026.1-T02-ConectaUnB
repo_name: REQ-2026.1-T02-ConectaUnB

nav:
  - Sobre: index.md

  - Cronograma: cronograma/cronograma.md

  - MVP: mvp/mvp.md

  - Reuniões grupo:
      - Reunião 1: reunioes/reuniao1.md
      - Reunião 2: reunioes/reuniao2.md
      - Reunião 3: reunioes/reuniao3.md
      - Reunião 4: reunioes/reuniao4.md
      - Reunião 5: reunioes/reuniao5.md
      # - Reunião 6: reunioes/reuniao6.md
      # - Reunião 7: reunioes/reuniao7.md
      # - Reunião 8: reunioes/reuniao8.md
      # - Reunião 9: reunioes/reuniao9.md
      # - Reunião 10: reunioes/reuniao10.md

  - Visão do Produto e Projeto:
      - "Cenário Atual": visaoDeProdutoProjeto/cenarioAtual.md
      - "Solução Proposta": visaoDeProdutoProjeto/solucaoProposta.md
      - "Intervenção social": visaoDeProdutoProjeto/intervencaoSocial.md
      - "Estratégias de Engenharia de Software": visaoDeProdutoProjeto/estrategias.md
      - "Engenharia de Requisitos": visaoDeProdutoProjeto/engenhariaDeRequisitos.md
      - "Interação entre equipe e cliente": visaoDeProdutoProjeto/interacao.md
      # - "Requisitos de Software": visaoDeProdutoProjeto/requisitosDeSoftware.md
      - "DoR e Dod": visaoDeProdutoProjeto/DoReDod.md
      # - "Backlog do Produto": visaoDeProdutoProjeto/backlog.md
      - "Lições Aprendidas": 
        - "Unidade 1": visaoDeProdutoProjeto/licoes/unidade1.md
        - "Unidade 2": visaoDeProdutoProjeto/licoes/unidade2.md
  
  - Requisitos:
      - "Requisitos Funcionais": requisitos/requisitosFuncionais.md
      - "Requisitos Não Funcionais": requisitos/requisitosNaoFuncionais.md
      - "Priorização de Requisitos": requisitos/priorizacao.md
      - "Backlog do Produto": requisitos/backlog.md

  - Apresentações:
      - Apresentação 1: entregas/entrega1.md
      - Apresentação 2: entregas/unidade2.md
      # - Apresentação 3: entregas/reuniao3.md
      # - Apresentação 4: entregas/reuniao4.md
  
  - Entrevistas/Evidências/Entregas:
      - "Fase 1 - Requisitos":
        - "Entrevista 1": userDesign/Fase1/analiseEntrevista24-04.md
        - "Entrevista 2": userDesign/Fase1/analiseEntrevista29-04.md
        - "Entrevista 3": userDesign/Fase1/analiseEntrevista30-04.md
      - "Fase 2 - User Design":
        - "Entrevista 1": userDesign/Fase2/entrevista1.md
        - "Protótipo 1": userDesign/Fase2/prototipos.md
        - "Evidências priorização (formulário)": userDesign/Fase2/evidenciasForms.md
        - "Protótipo 2": userDesign/Fase2/prototipos2.md
        - "Validação de protótipos (formulário)": userDesign/Fase2/evidenciasPrototipo2.md
      - "Fase 3 - Construction":
        - "Evidências Regras de Negócio": userDesign/Fase3/CA/evidenciasCA1.md
        - "Evidências Entrega": userDesign/Fase3/entregas/entregas.md
      - "Fase 4 - Cutover":
        - "Evidências Testes": userDesign/Fase4/cutover.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer

  disable_nav_previous_next: true

  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Trocar para modo escuro

    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Trocar para modo claro

  favicon: assets/logoUnb.ico
  logo: assets/logoUnb.ico

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.tasklist:
        custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  
plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
      draggable: true

extra_css: [stylesheets/extra.css]